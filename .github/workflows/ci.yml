name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libraylib-dev libgl1-mesa-dev libx11-dev

      - name: Build
        run: |
          gcc -o GBemu desktop_gbemu.c -s -O2 -lraylib -lGL -lm \
            -lpthread -ldl -lrt -lX11 -std=c11 -Wall
